<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Era of Empires - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
        <nav class="site-nav">
            <a href="index.html">Start</a>
            <a href="game.html">Game</a>
            <a href="login.html">Login</a>
            <a href="about.html">About Us</a>
            <a href="settings.html">Settings</a>
        </nav>
    </header>
    <div class="landing">
        <div class="landing-hero">
            <div class="login-card">
                <h1>Welcome to Era of Empires</h1>
                <div class="login-toggle">
                    <button type="button" id="mode-login" class="btn btn-accent">SIGN IN</button>
                    <button type="button" id="mode-register" class="btn">CREATE ACCOUNT</button>
                </div>
                <form id="auth-form">
                    <div class="field" id="username-field">
                        <label for="username">Username</label>
                        <input type="text" id="username" placeholder="Enter your username" required>
                    </div>
                    <div class="field">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Enter your email" required>
                    </div>
                    <div class="field">
                        <label for="password">Password</label>
                        <input type="password" id="password" placeholder="Enter your password" required>
                    </div>
                    <div class="error" id="error"></div>
                    <button type="submit" class="btn btn-accent full">SIGN IN / CREATE ACCOUNT</button>
                </form>
                <p class="login-alt">New to Era of Empires? <a href="#" id="switch-auth">Create an account</a></p>
            </div>
        </div>
    </div>
    <script>
        const API = window.location.hostname === 'localhost' ? 'http://localhost:3001' : (window.location.hostname.endsWith('.ts.net') ? 'https://' + window.location.hostname : '');
        let mode = 'login';

        const modeLoginBtn = document.getElementById('mode-login');
        const modeRegisterBtn = document.getElementById('mode-register');
        const switchAuthLink = document.getElementById('switch-auth');
        const usernameField = document.getElementById('username-field');
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const errorEl = document.getElementById('error');
        const form = document.getElementById('auth-form');

        function setMode(m) {
            mode = m;
            if (m === 'login') {
                usernameField.style.display = 'none';
                modeLoginBtn.classList.add('btn-accent');
                modeRegisterBtn.classList.remove('btn-accent');
                switchAuthLink.textContent = 'Create an account';
            } else {
                usernameField.style.display = 'block';
                modeLoginBtn.classList.remove('btn-accent');
                modeRegisterBtn.classList.add('btn-accent');
                switchAuthLink.textContent = 'Sign in';
            }
            errorEl.textContent = '';
        }

        modeLoginBtn.addEventListener('click', () => setMode('login'));
        modeRegisterBtn.addEventListener('click', () => setMode('register'));
        switchAuthLink.addEventListener('click', (e) => {
            e.preventDefault();
            setMode(mode === 'login' ? 'register' : 'login');
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const username = usernameInput.value.trim();
            const body = mode === 'login' ? { email, password } : { username, email, password };
            errorEl.textContent = '';
            try {
                const res = await fetch(API + (mode === 'login' ? '/api/auth/login' : '/api/auth/register'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (!res.ok) {
                    errorEl.textContent = data.error || 'Authentication failed';
                    return;
                }
                localStorage.setItem('era-of-empires-auth-token', data.token);
                localStorage.setItem('era-of-empires-user-id', data.user._id);
                window.location.href = 'menu.html';
            } catch (err) {
                errorEl.textContent = 'Cannot reach the server. Is the API running?';
            }
        });
    </script>
</body>
</html>
